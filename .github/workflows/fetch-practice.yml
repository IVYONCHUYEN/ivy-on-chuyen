name: Tải Listening Practice 1-33 từ Drive
on:
  workflow_dispatch:
  push:
    paths: ['tools/fetch_practice.py']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_practice.py
      - run: sudo apt-get install -y poppler-utils ffmpeg >/dev/null 2>&1 || true; for f in tools/raw/practice/*/*.bin; do [ -f "$f" ] && pdftotext -layout "$f" "${f%.bin}.pdf.txt" || true; done
      - run: |
          for f in audio/drive/*.mp3; do s=$(stat -c%s "$f"); if [ $s -gt 20000000 ]; then ffmpeg -y -loglevel error -i "$f" -ac 1 -b:a 64k /tmp/x.mp3 && mv /tmp/x.mp3 "$f"; fi; done
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/raw/practice audio/drive
          git commit -m "Listening Practice: tải từ Drive" || exit 0
          git pull --rebase && git push
