name: Chép lời bài nghe (Gemini)
on:
  workflow_dispatch:
  push:
    paths: ['tools/transcribe_ids.txt', 'tools/transcribe.py']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q google-genai
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          timeout 2400 python3 tools/transcribe.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/raw/listening
          git commit -m "Listening: chép lời audio bằng Gemini" || exit 0
          git pull --rebase && git push
