name: Tải bài Listening từ Drive
on:
  workflow_dispatch:
  push:
    paths: ['tools/listening_sources.txt', 'tools/fetch_listening.py']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_listening.py
      - run: sudo apt-get install -y poppler-utils >/dev/null 2>&1 || true; for f in tools/raw/listening/*.bin; do [ -f "$f" ] && pdftotext -layout "$f" "${f%.bin}.pdf.txt" || true; done
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/raw/listening audio/drive
          git commit -m "Listening: tải đề, đáp án và audio từ Drive" || exit 0
          git pull --rebase && git push
