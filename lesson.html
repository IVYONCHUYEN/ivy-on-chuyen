<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IVY GIFTED · Bài học</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<script>if(window.self!==window.top)document.documentElement.classList.add("embed")</script>
<style>
:root{
  --stage-a:#5b6fd6; --stage-b:#9a5cc7; --stage-c:#c983d9;
  --card:#17161c; --card-2:#22202b; --card-3:#15141b; --line:#3a3647;
  --fg:#f2eff8; --muted:#b4adc4; --dim:#857e96;
  --btn-a:#7b83f0; --btn-b:#6a4fd6;
  --green:#4fd18b; --red:#ff5d6c; --yellow:#ffd166; --cyan:#53c9e8; --orange:#ff9a3c;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--fg);background:linear-gradient(120deg,var(--stage-a),var(--stage-b) 55%,var(--stage-c));min-height:100vh;font-size:15px;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
a{color:#b9c0ff}
button,input,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#121117;border-radius:14px;padding:10px 16px;margin-bottom:22px}
.brand{font-weight:800;font-size:18px;background:linear-gradient(90deg,#9fa8ff,#e39bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.crumb{color:var(--muted);font-size:13px}
.code{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:700;background:var(--yellow);color:#2a1d00;padding:3px 10px;border-radius:99px}
h1{font-size:clamp(24px,4vw,36px);line-height:1.2;margin:0 0 6px;text-align:center;text-wrap:balance;text-shadow:0 2px 12px rgba(40,10,80,.35)}
.sub{text-align:center;color:#efe8ff;margin:0 auto 18px;max-width:72ch}
.goals{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 20px;padding:0;list-style:none}
.goals li{background:rgba(18,17,23,.55);border-radius:99px;padding:5px 12px;font-size:13px}
.tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.tab{border:0;border-radius:99px;padding:10px 18px;font-weight:700;font-size:15px;background:rgba(255,255,255,.18);color:#fff;cursor:pointer}
.tab .k{font-family:var(--mono);font-size:11px;opacity:.8;margin-right:6px}
.tab[aria-selected="true"]{background:#121117;box-shadow:0 0 0 2px #ffd16655}
.panel{background:var(--card);border:2px solid #2b2836;border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(30,10,60,.35)}
.ph{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.icon{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:28px;flex:none}
.ph h2{margin:0;font-size:21px}
.ph p{margin:0;color:var(--muted);font-size:14px}
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(180deg,var(--btn-a),var(--btn-b));cursor:pointer;box-shadow:0 4px 0 #3e2c8f}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #3e2c8f}
.btn.ghost{background:var(--card-2);box-shadow:none;border:1px solid var(--line)}
.btn.good{background:linear-gradient(180deg,#5fe09c,#2ea865);box-shadow:0 4px 0 #1d6b41;color:#06200f}
.btn.bad{background:linear-gradient(180deg,#ff8590,#e0475a);box-shadow:0 4px 0 #8c2532}
.btn.sm{padding:6px 12px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:13px;color:var(--dim)}
/* flashcards */
.fc-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px}
@media (max-width:820px){.fc-grid{grid-template-columns:minmax(0,1fr)}}
.stagebox{display:flex;flex-direction:column;align-items:center;gap:16px}
.flip{width:min(100%,520px);aspect-ratio:3/2;perspective:1200px;cursor:pointer;border:0;background:none;padding:0;color:inherit}
.flip-in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center}
.front{background:linear-gradient(160deg,#2f5fe0,#4f8df5);box-shadow:inset 0 0 0 4px #ffffff22}
.back{background:linear-gradient(160deg,#2a2638,#1d1b26);transform:rotateY(180deg);box-shadow:inset 0 0 0 2px var(--line)}
.emo{font-size:clamp(38px,7vw,58px);line-height:1}
.word{font-size:clamp(22px,4.2vw,36px);font-weight:800;line-height:1.15}
.pos{font-family:var(--mono);font-size:13px;background:#ffffff26;padding:2px 10px;border-radius:99px}
.vi{font-size:clamp(19px,3.4vw,26px);font-weight:700;color:var(--yellow)}
.ex{color:var(--muted);font-size:15px;max-width:46ch;margin:0}
.ex b{color:var(--fg)}
.hint{font-size:12px;color:#ffffffb0}
.speak{position:absolute;top:12px;right:12px;border:0;border-radius:12px;background:#ffffff2a;color:#fff;font-size:20px;width:44px;height:44px;cursor:pointer}
.prog{width:min(100%,520px)}
.bar{height:10px;border-radius:99px;background:var(--card-2);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));width:0;transition:width .4s}
.prog small{display:flex;justify-content:space-between;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.side h3{margin:0 0 10px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.wl{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:460px;overflow:auto}
.wl li{display:flex;gap:8px;align-items:center;background:var(--card-2);border-radius:10px;padding:6px 10px;font-size:14px;cursor:pointer}
.wl li .vi2{color:var(--muted);font-size:12px;display:block}
.wl li .st{margin-left:auto;font-size:12px;font-weight:700;color:var(--dim);white-space:nowrap}
.wl li.ok .st{color:var(--green)} .wl li.no .st{color:var(--orange)}
.done{text-align:center;padding:24px}
.done .big{font-size:48px}
/* theory */
.th{display:grid;gap:16px}
.tcard{background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.tcard h3{margin:0 0 8px;font-size:17px;color:var(--yellow)}
.tcard p{margin:6px 0}
.tcard ul,.tcard ol{margin:6px 0;padding-left:20px}
.tcard li{margin:3px 0}
.tcard .eg{display:block;background:var(--card-3);border-left:3px solid var(--cyan);border-radius:8px;padding:8px 12px;margin:8px 0;color:#e6e0f2}
.tcard .tip{display:block;background:#2b2210;border-left:3px solid var(--orange);border-radius:8px;padding:8px 12px;margin:8px 0;color:#ffe3c2}
.tcard em{color:#ffd9a8;font-style:normal;font-weight:600}
.tcard b{color:#fff}
.tw{overflow-x:auto;margin:8px 0}
.tcard table{border-collapse:collapse;width:100%;min-width:480px;font-size:14px}
.tcard th,.tcard td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.tcard th{color:var(--muted);font-weight:600}
.res{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.res a{display:inline-flex;gap:6px;align-items:center;background:var(--card-3);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;text-decoration:none;color:var(--fg)}
.res a:hover{border-color:var(--cyan)}
/* practice */
.ex-sec{background:var(--card-2);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px}
.ex-sec h3{margin:0 0 4px;font-size:17px}
.ex-sec .intro{color:var(--muted);font-size:14px;margin:0 0 12px}
.passage{background:var(--card-3);border-radius:12px;padding:12px 14px;font-size:15px;color:#e1dbee;margin-bottom:12px;border:1px solid var(--line);line-height:1.75}
.passage b{color:var(--yellow)}
.q{padding:12px 0;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:0}
.qs{margin:0 0 8px;font-weight:600}
.qs .n{font-family:var(--mono);font-size:12px;background:var(--yellow);color:#2a1d00;border-radius:6px;padding:1px 7px;margin-right:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--card-3);border:2px solid var(--line);border-radius:12px;padding:8px 12px;color:var(--fg);cursor:pointer;font-size:14px}
.opt .L{font-family:var(--mono);font-weight:700;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none;color:#111;font-size:12px}
.LA{background:#ff8a65}.LB{background:#4fc3f7}.LC{background:#aed581}.LD{background:#ffd54f}.LE{background:#ce93d8}.LF{background:#80cbc4}.LG{background:#f48fb1}.LH{background:#bcaaa4}
.opt.sel{border-color:var(--cyan)}
.opt.right{border-color:var(--green);background:#123224}
.opt.wrong{border-color:var(--red);background:#3a1520}
.inp{background:var(--card-3);border:2px solid var(--line);border-radius:10px;color:var(--fg);padding:7px 10px;font-size:15px;min-width:0}
.inp.right{border-color:var(--green)}
.inp.wrong{border-color:var(--red)}
.inp.w{width:100%}
.gapline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fb{margin-top:8px;font-size:14px;border-radius:10px;padding:8px 12px;display:none}
.fb.show{display:block}
.fb.ok{background:#123224;color:#c9f5dd}
.fb.no{background:#3a1520;color:#ffd6dc}
.fb b{color:#fff}
u.seg{text-decoration:none;border-bottom:2px solid var(--cyan);padding:0 2px}
u.seg sup{font-family:var(--mono);font-size:10px;color:var(--cyan);margin-left:2px}
.letters{display:flex;gap:6px}
.letters button{width:36px;height:34px;border-radius:9px;border:2px solid var(--line);background:var(--card-3);color:var(--fg);font-family:var(--mono);font-weight:700;cursor:pointer}
.letters button.sel{border-color:var(--cyan);background:#16303a}
.letters button.right{border-color:var(--green);background:#123224}
.letters button.wrong{border-color:var(--red);background:#3a1520}
.prompt{color:var(--muted);font-size:13px;margin:4px 0}
.prompt b{color:var(--yellow);font-family:var(--mono)}
.scorebar{position:sticky;bottom:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#121117ee;border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:6px;backdrop-filter:blur(6px)}
.scorebar b{font-size:20px;font-variant-numeric:tabular-nums}
/* writing */
.wbox{background:var(--card-2);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px}
.wbox h3{margin:0 0 6px;font-size:17px}
.wprompt{background:var(--card-3);border-left:3px solid var(--yellow);border-radius:8px;padding:10px 14px;margin:8px 0}
textarea.inp{width:100%;min-height:220px;line-height:1.6;resize:vertical}
.wc{font-family:var(--mono);font-size:13px;color:var(--muted)}
details{margin-top:10px}
summary{cursor:pointer;font-weight:700;color:var(--cyan)}
.model{background:var(--card-3);border-radius:10px;padding:12px 14px;margin-top:8px;white-space:pre-wrap}
.checks{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}
.checks label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.checks input{margin-top:5px;accent-color:var(--green)}
.err{background:var(--card);border-radius:16px;padding:24px;text-align:center}
@media (prefers-reduced-motion:reduce){.flip-in{transition:none}}


.hero{position:relative;overflow:hidden;isolation:isolate;border-radius:20px;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:10px;align-items:center;padding:26px 30px;margin-bottom:20px;background:#d9e6fb;box-shadow:0 10px 26px rgba(16,24,40,.08)}
.hero .ivy-sky{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero h1{text-align:left;color:#23314a}
.hero .sub{text-align:left;margin:6px 0 12px;color:#2f3b52;max-width:none}
.hero .goals{justify-content:flex-start;margin:0}
.hero .goals li{background:rgba(255,255,255,.85);border-color:transparent}
.hero-art{position:relative;display:flex;flex-direction:column;align-items:center}
.hero-art .gifty{width:190px;height:auto;filter:drop-shadow(0 8px 14px rgba(60,40,90,.18))}
.hero-art .bubble{background:#fff;border-radius:14px;padding:8px 12px;font-weight:700;font-size:13px;color:#9b1c1c;box-shadow:0 6px 16px rgba(16,24,40,.12);margin-bottom:4px;text-align:center;position:relative}
.hero-art .bubble::after{content:"";position:absolute;left:50%;bottom:-14px;margin-left:-7px;border:7px solid transparent;border-top-color:#fff}
@media (max-width:600px){.hero{grid-template-columns:1fr;padding:20px}.hero-art{flex-direction:row;gap:8px}.hero-art .gifty{width:110px;order:-1}.hero-art .bubble::after{display:none}}
.ph>div:not(.icon):not(.row){flex:1 1 220px;min-width:0}
/* ===== IVY GIFTED light theme ===== */
:root{--card:#ffffff;--card-2:#f7f8fa;--card-3:#ffffff;--line:#e3e6eb;--fg:#1f2328;--muted:#5f6672;--dim:#8a909b;
  --btn-a:#a52020;--btn-b:#8a1717;--green:#15803d;--red:#c0262d;--yellow:#b45309;--cyan:#9b1c1c;--orange:#c2410c;
  --font:"Quicksand","Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
body{background:#f6f7f9;font-weight:500}
html.embed body{background:transparent}
html.embed .top{display:none}
.top{background:#fff;border:1px solid var(--line)}
.brand{background:none;-webkit-background-clip:initial;background-clip:initial;color:#9b1c1c}
.code{background:#9b1c1c;color:#fff}
h1{text-shadow:none;color:#1f2328}
.sub{color:#4b5563}
.sub b{color:#9b1c1c}
.goals li{background:#fff;border:1px solid var(--line);color:#374151}
.tab{background:#fff;color:#374151;border:1px solid var(--line)}
.tab[aria-selected="true"]{background:#9b1c1c;color:#fff;box-shadow:none;border-color:#9b1c1c}
.panel{border:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.btn{box-shadow:0 3px 0 #6e1111}
.btn:active{box-shadow:0 1px 0 #6e1111}
.btn.ghost{background:#fff;color:#1f2328;border:1px solid var(--line)}
.btn.good{background:linear-gradient(180deg,#22a35a,#15803d);box-shadow:0 3px 0 #0f5e2c;color:#fff}
.btn.bad{background:linear-gradient(180deg,#e2525a,#c0262d);box-shadow:0 3px 0 #8c1c21}
.front{background:linear-gradient(160deg,#b42323,#8a1717)}
.back{background:#fff;box-shadow:inset 0 0 0 2px var(--line)}
.vi{color:#9b1c1c}
.wl li{background:#f7f8fa}
.wl li .vi2{color:var(--muted)}
.tcard{background:#fff}
.tcard h3{color:#9b1c1c}
.tcard .eg{background:#f7f8fa;border-left-color:#9b1c1c;color:#1f2328}
.tcard .tip{background:#fff7ed;border-left-color:#c2410c;color:#7c2d12}
.tcard em{color:#9b1c1c}
.tcard b{color:#111827}
.res a{background:#fff;color:#1f2328}
.res a:hover{border-color:#9b1c1c}
.ex-sec{background:#fff}
.passage{background:#f7f8fa;color:#1f2328}
.passage b{color:#9b1c1c}
.qs .n{background:#9b1c1c;color:#fff}
.opt{background:#fff;color:#1f2328}
.opt .L{color:#111}
.opt.sel{border-color:#9b1c1c;background:#fbeaea}
.opt.right{border-color:#15803d;background:#e7f6ec}
.opt.wrong{border-color:#c0262d;background:#fdecec}
.inp{background:#fff;color:#1f2328}
.inp:focus{border-color:#9b1c1c;outline:none}
.fb.ok{background:#e7f6ec;color:#14532d}
.fb.no{background:#fdecec;color:#7f1d1d}
.fb b{color:#111827}
u.seg{border-bottom-color:#9b1c1c}
u.seg sup{color:#9b1c1c}
.letters button{background:#fff;color:#1f2328}
.letters button.sel{border-color:#9b1c1c;background:#fbeaea}
.letters button.right{border-color:#15803d;background:#e7f6ec}
.letters button.wrong{border-color:#c0262d;background:#fdecec}
.scorebar{background:#fffffff0;color:#1f2328;box-shadow:0 6px 20px rgba(16,24,40,.08)}
.wbox{background:#fff}
.wprompt{background:#f7f8fa;border-left-color:#9b1c1c}
.model{background:#f7f8fa}
summary{color:#9b1c1c}
.checks input{accent-color:#9b1c1c}
.err{background:#fff;border:1px solid var(--line)}
.back .speak{background:#f3f4f6;color:#1f2328}
.back .pos{background:#f3f4f6}
.rvbar[hidden]{display:none!important}
.rvbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12;border-radius:12px;padding:10px 14px;margin:8px 0}
.gate{text-align:center;background:#fff;border:2px dashed #e3b4b4;border-radius:16px;padding:26px 18px;margin:10px 0}
.gate .big{font-size:42px}.gate h3{margin:6px 0;color:#9b1c1c}.gate p{color:#4b5563;max-width:56ch;margin:6px auto 14px}
.gate.sm{padding:12px 16px;text-align:left;border-style:solid;border-width:1px;background:#fbeaea;color:#7f1d1d}
.clock{font-weight:800;font-variant-numeric:tabular-nums;background:#9b1c1c;color:#fff;border-radius:10px;padding:6px 12px}
.clock.warn{background:#dc2626;animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.06)}}
.attn{font-size:13px;color:#6b7280;margin-left:6px}
#pQs.locked .opt,#pQs.locked .letters button{cursor:default}
.hist{margin-top:18px}.hist h3{margin:0 0 8px;color:#9b1c1c}
.hist table{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hist th,.hist td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}.hist th{background:#f7f8fa;color:#6b7280;font-weight:600}
/* === IVY: thẻ từ vựng nền đỏ chữ trắng; MCQ chữ cái trắng; đáp án đúng xanh / sai đỏ === */
.front,.back{background:linear-gradient(160deg,#b42323,#8a1717)!important;color:#fff!important;box-shadow:inset 0 0 0 4px #ffffff22!important}
.front *,.back *{color:#fff!important}
.face .ex{color:#ffffffd9!important}.face .hint{color:#ffffffb3!important}
.back .speak,.back .pos,.front .speak,.front .pos{background:#ffffff2a!important}
.wl li{background:#9b1c1c!important;color:#fff!important}
.wl li *{color:#fff!important}.wl li .vi2{color:#ffffffcc!important}
.wl li.ok{background:#7f1515!important;box-shadow:inset 4px 0 0 #4ade80}
.opt .L,.LA,.LB,.LC,.LD,.LE,.LF,.LG,.LH{background:#fff!important;color:#9b1c1c!important;box-shadow:inset 0 0 0 1.5px #e3b4b4}
.opt.right,.letters button.right{background:#16a34a!important;border-color:#15803d!important;color:#fff!important}
.opt.right .L{color:#15803d!important;box-shadow:none}
.opt.wrong,.letters button.wrong{background:#dc2626!important;border-color:#b91c1c!important;color:#fff!important}
.opt.wrong .L{color:#b91c1c!important;box-shadow:none}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="err">Đang tải bài học…</div></div>
<script src="config.js"></script>
<script src="track.js"></script>
<script src="ai-check.js"></script>
<script src="mascot.js"></script>
<script>
(function(){
const P=new URLSearchParams(location.search);
const code=(P.get("b")||"B03").toUpperCase().replace(/[^A-Z0-9]/g,"");
const s=document.createElement("script");
s.src="data/"+code+".js";
s.onload=()=>start(window.LESSON);
s.onerror=()=>{document.getElementById("app").innerHTML='<div class="err"><h2>Chưa có nội dung buổi '+code+'</h2><p>Buổi này đang được soạn. Em quay lại sau nhé.</p></div>'};
document.head.appendChild(s);

function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function slug(t){return t.toLowerCase().replace(/\(.*?\)/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function norm(t){return String(t).toLowerCase().replace(/[’‘`]/g,"'").replace(/\bcan't\b/g,"cannot").replace(/\bcan not\b/g,"cannot").replace(/\bwon't\b/g,"will not").replace(/\bshan't\b/g,"shall not").replace(/n't\b/g," not").replace(/'m\b/g," am").replace(/'re\b/g," are").replace(/'ll\b/g," will").replace(/'ve\b/g," have").replace(/'d\b/g," would").replace(/[“”]/g,'"').replace(/\s+/g," ").replace(/\s*([,.;:!?])\s*/g,"$1 ").replace(/[.!?]\s*$/,"").trim()}
function tts(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
let _au=null;
function say(t){t=t.replace(/\(.*?\)/g,"").trim();try{if(_au)_au.pause();try{speechSynthesis.cancel()}catch(e){}_au=new Audio("audio/"+slug(t)+".mp3");_au.play().catch(()=>tts(t))}catch(e){tts(t)}}
const store={get(k,d){try{const v=localStorage.getItem("ivy-"+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("ivy-"+k,JSON.stringify(v))}catch(e){}}};

/* ---------- VOCAB ---------- */
function vocab(L){
  const W=L.vocab, el=document.getElementById("p-v");
  el.innerHTML=`<div class="ph"><div class="icon" style="background:linear-gradient(160deg,#2f5fe0,#4f8df5)">🃏</div>
   <div style="min-width:0;flex:1"><h2>Thẻ lật${L.topic?" – "+esc(L.topic):""}</h2><p>Bấm thẻ để lật, bấm 🔊 để nghe. Thẻ “Chưa thuộc” quay lại cuối bộ đến khi thuộc hết.</p></div>
   <div class="row"><button class="btn ghost sm" id="fcMode">Chiều: Anh → Việt</button><button class="btn ghost sm" id="fcReset">Học lại</button></div></div>
   <div class="fc-grid"><div class="stagebox" id="fcStage">
     <button class="flip" id="flip" type="button" aria-label="Lật thẻ"><div class="flip-in"><div class="face front" id="fF"></div><div class="face back" id="fB"></div></div></button>
     <div class="row" style="justify-content:center"><button class="btn bad" id="fcNo">✗ Chưa thuộc</button><button class="btn good" id="fcYes">✓ Đã thuộc</button></div>
     <div class="prog"><div class="bar"><i id="fcBar"></i></div><small><span id="fcTxt"></span><span id="fcLeft"></span></small></div>
   </div><aside class="side"><h3>Danh sách ${W.length} từ</h3><ul class="wl" id="wl"></ul>
   ${L.vocabNote?`<p class="note" style="margin-top:10px">${L.vocabNote}</p>`:""}</aside></div>`;
  let queue,known,seen,dir="en",cur=0;
  const flip=el.querySelector("#flip"),fF=el.querySelector("#fF"),fB=el.querySelector("#fB");
  function init(){queue=W.map((_,i)=>i);known=new Set();seen=new Set();render()}
  function render(){
    const wl=el.querySelector("#wl");
    wl.innerHTML=W.map((w,i)=>`<li data-i="${i}" class="${known.has(i)?"ok":seen.has(i)?"no":""}"><span>${w[3]||"•"}</span><span>${esc(w[0])}<span class="vi2">${esc(w[2])}</span></span><span class="st">${known.has(i)?"Đã thuộc":seen.has(i)?"Ôn lại":"🔊"}</span></li>`).join("");
    el.querySelector("#fcBar").style.width=(known.size/W.length*100)+"%";
    el.querySelector("#fcTxt").textContent=`${known.size}/${W.length} đã thuộc`;
    el.querySelector("#fcLeft").textContent=queue.length?`còn ${queue.length} thẻ`:"";
    flip.classList.remove("on");
    const box=el.querySelector("#fcStage"),dn=el.querySelector("#fcDone");
    if(!queue.length){flip.hidden=true;el.querySelector("#fcNo").hidden=el.querySelector("#fcYes").hidden=true;
      if(!dn){const d=document.createElement("div");d.className="done";d.id="fcDone";d.innerHTML=`<div class="big">🎉</div><h3>Thuộc cả ${W.length} từ!</h3><p class="ex">Chuyển sang tab Lý thuyết nhé.</p>`;box.insertBefore(d,box.firstChild)}return}
    if(dn)dn.remove();flip.hidden=false;el.querySelector("#fcNo").hidden=el.querySelector("#fcYes").hidden=false;
    cur=queue[0];const w=W[cur];
    const sp='<button class="speak" type="button" aria-label="Nghe phát âm" data-say="1">🔊</button>';
    const en=`${sp}<div class="emo">${w[3]||""}</div><div class="word">${esc(w[0])}</div><span class="pos">${esc(w[1])}</span>`;
    if(dir==="en"){fF.innerHTML=en+'<span class="hint">Bấm để lật</span>';fB.innerHTML=`${sp}<div class="word" style="font-size:22px">${esc(w[0])}</div><div class="vi">${esc(w[2])}</div><p class="ex">${w[4]||""}</p>`}
    else{fF.innerHTML=`<div class="emo">${w[3]||""}</div><div class="vi">${esc(w[2])}</div><span class="hint">Nhớ ra từ tiếng Anh rồi bấm để lật</span>`;fB.innerHTML=en+`<p class="ex">${w[4]||""}</p>`}
  }
  flip.addEventListener("click",e=>{if(e.target.closest("[data-say]")){e.stopPropagation();say(W[cur][0]);return}flip.classList.toggle("on");if(flip.classList.contains("on")&&dir==="vi")say(W[cur][0])});
  el.querySelector("#wl").addEventListener("click",e=>{const li=e.target.closest("li");if(li)say(W[+li.dataset.i][0])});
  el.querySelector("#fcYes").addEventListener("click",()=>{seen.add(cur);known.add(cur);queue.shift();render()});
  el.querySelector("#fcNo").addEventListener("click",()=>{seen.add(cur);queue.push(queue.shift());render()});
  el.querySelector("#fcMode").addEventListener("click",e=>{dir=dir==="en"?"vi":"en";e.target.textContent=dir==="en"?"Chiều: Anh → Việt":"Chiều: Việt → Anh";render()});
  el.querySelector("#fcReset").addEventListener("click",init);
  init();
}

/* ---------- PRACTICE ---------- */
function practice(L){
  const el=document.getElementById("p-p");
  const MAXA=3, AK="att-"+L.code;
  let total=0;const graders=[];
  /* thời gian làm bài theo dung lượng đề */
  const SEC={mcq:45,gap:60,fix:75,rewrite:120};
  let secs=0;L.practice.forEach(sec=>{secs+=sec.items.length*(SEC[sec.type]||60);if(sec.audio)secs+=180;if(sec.passage)secs+=Math.min(300,Math.round(String(sec.passage).replace(/<[^>]+>/g,"").split(/\s+/).length/150*60))});
  const MIN=Math.max(5,Math.ceil(secs/60));
  const html=L.practice.map((sec,si)=>{
    const head=`<div class="ex-sec" data-sec="${si}"><h3>${sec.title}</h3>${sec.intro?`<p class="intro">${sec.intro}</p>`:""}${sec.audio?`<div class="passage"><audio controls preload="none" style="width:100%" src="audio/listen/${sec.audio}.mp3" onerror="this.outerHTML='<p class=note>Audio bài nghe đang được tạo tự động, em đọc lời thoại bên dưới thay cho nghe nhé.</p>'"></audio><details${sec.audioOpen?" open":""}><summary>Lời thoại (chỉ mở sau khi làm xong)</summary><div style="white-space:pre-line;margin-top:8px">${esc(sec.script||"").replace(/^(\w+):/gm,"<b>$1:</b>")}</div></details></div>`:""}${sec.passage?`<div class="passage">${sec.passage}</div>`:""}`;
    const items=sec.items.map((it,qi)=>{total++;const id=`q${si}_${qi}`;const n=total;
      if(sec.type==="mcq"){const opts=sec.options||it[1];const stem=it[0];const ans=sec.options?it[1]:it[2];const ex=sec.options?it[2]:it[3];
        graders.push({id,type:"mcq",ans,ex,opts});
        return `<div class="q" id="${id}"><p class="qs"><span class="n">${n}</span>${stem}</p><div class="opts">${opts.map((o,k)=>`<button type="button" class="opt" data-k="${k}"><span class="L L${"ABCDEFGH"[k]}">${"ABCDEFGH"[k]}</span><span>${o}</span></button>`).join("")}</div><div class="fb"></div></div>`}
      if(sec.type==="gap"){graders.push({id,type:"gap",ans:it[1],ex:it[2]});
        const stem=it[0].includes("___")?it[0].replace("___",`<input class="inp" aria-label="Đáp án câu ${n}" size="14">`):`${it[0]} <input class="inp" aria-label="Đáp án câu ${n}" size="14">`;
        return `<div class="q" id="${id}"><p class="qs"><span class="n">${n}</span>${stem}</p><div class="fb"></div></div>`}
      if(sec.type==="fix"){graders.push({id,type:"fix",wrong:it[1],ans:it[2],ex:it[3]});
        let k=0;const sent=it[0].replace(/\[([^\]]+)\]/g,(m,t)=>`<u class="seg">${t}<sup>${"ABCD"[k++]}</sup></u>`);
        return `<div class="q" id="${id}"><p class="qs"><span class="n">${n}</span>${sent}</p><div class="gapline"><span class="prompt">Lỗi ở:</span><div class="letters">${"ABCD".slice(0,k).split("").map((c,j)=>`<button type="button" data-k="${j}">${c}</button>`).join("")}</div><span class="prompt">Sửa thành:</span><input class="inp" aria-label="Sửa lỗi câu ${n}" size="16"></div><div class="fb"></div></div>`}
      if(sec.type==="rewrite"){graders.push({id,type:"rewrite",ans:it[2],ex:it[3],q:it[0],h:it[1]||""});
        return `<div class="q" id="${id}"><p class="qs"><span class="n">${n}</span>${it[0]}</p>${it[1]?`<p class="prompt">${it[1]}</p>`:""}<input class="inp w" aria-label="Viết lại câu ${n}"><div class="fb"></div></div>`}
    }).join("");
    return head+items+"</div>";
  }).join("");

  /* ---- trạng thái các lần làm ---- */
  const S=store.get(AK,null)||{hist:[],cur:null,locked:false};
  const save=()=>store.set(AK,S);
  const used=()=>S.hist.length;
  const fmtT=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
  const p2=x=>String(x).padStart(2,"0"),fmtD=t=>{const d=new Date(t);return p2(d.getDate())+"/"+p2(d.getMonth()+1)+" "+p2(d.getHours())+":"+p2(d.getMinutes())};

  el.innerHTML=`<div class="ph"><div class="icon" style="background:linear-gradient(160deg,#2ea865,#5fe09c)">✍️</div><div style="min-width:0;flex:1"><h2>Luyện tập theo dạng đề</h2><p>Mỗi bài được làm tối đa <b>${MAXA} lần</b>, mỗi lần <b>${MIN} phút</b>. Lần 1–2 chỉ báo câu đúng/sai; đáp án và giải thích hiện sau lần thứ ${MAXA} (hoặc khi em làm đúng hết).</p></div></div>
  <div id="pGate"></div>
  <div id="pReview" class="rvbar" hidden></div>
  <div id="pQs">${html}</div>
  <div class="scorebar" id="pBar"><span>Điểm: <b id="sc">–</b> / ${total} <span class="attn" id="attn"></span> <small id="sentNote" class="note" style="margin-left:8px"></small></span><span class="clock" id="clk" hidden></span><div class="row"><button class="btn ghost sm" id="rs" hidden>Làm lại</button><button class="btn" id="gr">Nộp bài</button></div></div>
  <div class="hist" id="pHist"></div>`;
  const qsBox=el.querySelector("#pQs"),gate=el.querySelector("#pGate"),bar=el.querySelector("#pBar"),rv=el.querySelector("#pReview");

  /* ---- đọc / ghi đáp án ---- */
  function read(){const a={};graders.forEach(g=>{const q=document.getElementById(g.id);
    if(g.type==="mcq"){const s=q.querySelector(".opt.sel");a[g.id]=s?+s.dataset.k:-1}
    else if(g.type==="fix"){const s=q.querySelector(".letters button.sel");a[g.id]={k:s?+s.dataset.k:-1,v:q.querySelector("input").value}}
    else a[g.id]=q.querySelector("input").value});return a}
  function fill(a){a=a||{};graders.forEach(g=>{const q=document.getElementById(g.id),v=a[g.id];
    if(g.type==="mcq")q.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",v!==undefined&&+x.dataset.k===v));
    else if(g.type==="fix"){q.querySelectorAll(".letters button").forEach(x=>x.classList.toggle("sel",!!v&&+x.dataset.k===v.k));q.querySelector("input").value=v?v.v||"":""}
    else q.querySelector("input").value=v||""})}
  function clearMarks(){qsBox.querySelectorAll(".right,.wrong").forEach(x=>x.classList.remove("right","wrong"));qsBox.querySelectorAll(".fb").forEach(f=>{f.className="fb";f.innerHTML=""})}
  function lock(on){qsBox.classList.toggle("locked",on);qsBox.querySelectorAll("input").forEach(i=>i.disabled=on)}
  const fb=(q,cls,msg)=>{const f=q.querySelector(".fb");f.className="fb show "+cls;f.innerHTML=msg};

  /* ---- chấm (đồng bộ; câu viết lại khác key → AI) ---- */
  function judge(a){const res={},pend=[];
    graders.forEach(g=>{const v=a[g.id];let ok=false;
      if(g.type==="mcq")ok=v===g.ans;
      if(g.type==="gap")ok=g.ans.some(x=>norm(x)===norm(v||""));
      if(g.type==="fix")ok=!!v&&v.k===g.wrong&&g.ans.some(x=>norm(x)===norm(v.v||""));
      if(g.type==="rewrite"){ok=g.ans.some(x=>norm(x)===norm(v||""));
        if(!ok&&String(v||"").trim().split(/\s+/).length>=2&&window.IVY_AI){const t1=document.createElement("div");t1.innerHTML=g.q;const t2=document.createElement("div");t2.innerHTML=g.h;
          pend.push(IVY_AI.check({q:t1.textContent,h:t2.textContent,a:g.ans,r:v}).then(r=>{if(r&&r.correct)res[g.id]=1;if(r&&r.reason)res["why_"+g.id]=r.reason}))}}
      res[g.id]=ok?1:0});
    return Promise.all(pend).then(()=>res)}

  /* ---- hiển thị kết quả: reveal=false chỉ đúng/sai ---- */
  function show(a,res,reveal){clearMarks();fill(a);
    graders.forEach(g=>{const q=document.getElementById(g.id),ok=!!res[g.id],v=a[g.id],why=res["why_"+g.id];
      const tag=ok?"✓ Đúng.":"✗ Sai.";
      if(g.type==="mcq"){q.querySelectorAll(".opt").forEach(x=>{const k=+x.dataset.k;if(k===v)x.classList.add(ok?"right":"wrong");if(reveal&&k===g.ans)x.classList.add("right")});
        fb(q,ok?"ok":"no",reveal?`${tag} Đáp án <b>${"ABCDEFGH"[g.ans]}</b>. ${g.ex||""}`:(v<0?"✗ Chưa chọn đáp án.":tag))}
      if(g.type==="gap"){const i=q.querySelector("input");i.classList.add(ok?"right":"wrong");
        fb(q,ok?"ok":"no",reveal?`${tag} Đáp án: <b>${esc(g.ans[0])}</b>${g.ans.length>1?" (chấp nhận: "+g.ans.slice(1).map(esc).join(", ")+")":""}. ${g.ex||""}`:tag)}
      if(g.type==="fix"){const i=q.querySelector("input");q.querySelectorAll(".letters button").forEach(x=>{const k=+x.dataset.k;if(v&&k===v.k)x.classList.add(v.k===g.wrong?"right":"wrong");if(reveal&&k===g.wrong)x.classList.add("right")});
        i.classList.add(ok?"right":"wrong");
        fb(q,ok?"ok":"no",reveal?`${tag} Lỗi ở <b>${"ABCD"[g.wrong]}</b>, sửa thành <b>${esc(g.ans[0])}</b>. ${g.ex||""}`:tag)}
      if(g.type==="rewrite"){const i=q.querySelector("input");i.classList.add(ok?"right":"wrong");const m=!g.ans.some(x=>norm(x)===norm(v||""));
        fb(q,ok?"ok":"no",reveal?`${tag} ${ok&&m?"Câu của em khác đáp án mẫu nhưng đúng nghĩa và ngữ pháp. ":""}${!ok&&why?esc(why)+" ":""}Đáp án mẫu: <b>${esc(g.ans[0].replace(/[.]\s*$/,""))}</b>. ${g.ex||""}`:tag)}});
    qsBox.querySelectorAll("details").forEach(d=>d.hidden=!reveal&&!S.locked)}
  const score=res=>graders.reduce((s,g)=>s+(res[g.id]?1:0),0);
  const detail=res=>{const d={};graders.forEach(g=>{d[g.type]=d[g.type]||[0,0];d[g.type][1]++;if(res[g.id])d[g.type][0]++});return d};

  /* ---- đồng hồ (hiện nổi ở trang ngoài nếu đang nằm trong khung) ---- */
  let tick=null,warned=false;
  const host=(()=>{try{if(window.top!==window&&window.top.document)return window.top.document}catch(e){}return document})();
  function chip(){let c=host.getElementById("ivyClock");if(!c){if(!host.getElementById("ivyClockCss")){const st=host.createElement("style");st.id="ivyClockCss";st.textContent="#ivyClock{position:fixed;right:18px;bottom:18px;z-index:9999;background:#9b1c1c;color:#fff;font:700 18px/1 system-ui,sans-serif;padding:12px 16px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}#ivyClock small{font-weight:600;font-size:12px;opacity:.85}#ivyClock.warn{background:#dc2626;animation:ivyPulse 1s infinite}@keyframes ivyPulse{50%{transform:scale(1.07)}}#ivyWarn{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:10000;background:#dc2626;color:#fff;font:700 16px system-ui,sans-serif;padding:12px 20px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}";host.head.appendChild(st)}
      c=host.createElement("div");c.id="ivyClock";host.body.appendChild(c)}return c}
  function stopClock(){clearInterval(tick);tick=null;const c=host.getElementById("ivyClock");if(c)c.remove();const w=host.getElementById("ivyWarn");if(w)w.remove();el.querySelector("#clk").hidden=true}
  window.addEventListener("pagehide",stopClock);
  function beep(){try{const A=new (window.AudioContext||window.webkitAudioContext)();[0,.25].forEach(d=>{const o=A.createOscillator(),g=A.createGain();o.frequency.value=880;o.connect(g);g.connect(A.destination);g.gain.value=.15;o.start(A.currentTime+d);o.stop(A.currentTime+d+.15)})}catch(e){}}
  function runClock(){const k=el.querySelector("#clk");k.hidden=false;warned=false;
    const upd=()=>{const left=(S.cur.deadline-Date.now())/1000;const t="⏱ "+fmtT(left);k.textContent=t;k.classList.toggle("warn",left<=60);
      const c=chip();c.innerHTML=`${t}<small>Lần ${S.cur.n}/${MAXA}</small>`;c.classList.toggle("warn",left<=60);
      if(left<=60&&!warned){warned=true;beep();const w=host.createElement("div");w.id="ivyWarn";w.textContent="⚠️ Còn 1 phút! Kiểm tra lại bài và nộp nhé.";host.body.appendChild(w);setTimeout(()=>w.remove(),6000)}
      if(left<=0){submit(true)}};
    clearInterval(tick);tick=setInterval(upd,500);upd()}

  /* ---- các trạng thái ---- */
  function renderHist(){const h=el.querySelector("#pHist");
    if(!S.hist.length){h.innerHTML="";return}
    h.innerHTML=`<h3>Lịch sử làm bài</h3><table><thead><tr><th>Lần</th><th>Thời điểm</th><th>Điểm</th><th>Thời gian làm</th><th></th></tr></thead><tbody>${S.hist.map((x,i)=>`<tr><td>${i+1}/${MAXA}</td><td>${fmtD(x.t)}</td><td><b>${x.score}</b> / ${x.total}${x.auto?' <small class="note">(hết giờ)</small>':""}</td><td>${fmtT(x.dur)}</td><td><button class="btn ghost sm" data-rv="${i}">Xem lại</button></td></tr>`).join("")}</tbody></table>`}
  function setBar(mode){const gr=el.querySelector("#gr"),rs=el.querySelector("#rs"),at=el.querySelector("#attn");
    gr.hidden=mode!=="doing";rs.hidden=mode!=="graded";gr.disabled=false;
    rs.textContent=`Làm lại (lần ${used()+1}/${MAXA})`;
    at.textContent=mode==="doing"?`· Lần ${S.cur.n}/${MAXA}`:mode==="locked"?"· Đã khoá – xem đáp án bên dưới":`· Đã làm ${used()}/${MAXA} lần`;
    const last=S.hist[S.hist.length-1];el.querySelector("#sc").textContent=mode==="doing"?"–":last?last.score:"–"}
  function stateIntro(){stopClock();rv.hidden=true;qsBox.hidden=true;bar.hidden=true;
    gate.innerHTML=`<div class="gate"><div class="big">⏱️</div><h3>Lần làm ${used()+1}/${MAXA}</h3><p>${total} câu · thời gian <b>${MIN} phút</b>. Đồng hồ bắt đầu chạy khi em bấm nút, hết giờ bài tự nộp.<br>Lần 1–2 chỉ báo câu đúng/sai; đáp án hiện sau lần ${MAXA}.</p><button class="btn" id="go">Bắt đầu làm bài</button></div>`;
    gate.querySelector("#go").addEventListener("click",()=>{const prev=S.hist[S.hist.length-1];S.cur={n:used()+1,start:Date.now(),deadline:Date.now()+MIN*60000,ans:prev?prev.ans:{}};save();stateDoing()});renderHist()}
  function stateDoing(){gate.innerHTML="";rv.hidden=true;qsBox.hidden=false;bar.hidden=false;clearMarks();fill(S.cur.ans);lock(false);
    qsBox.querySelectorAll("details").forEach(d=>d.hidden=true);setBar("doing");renderHist();
    if(Date.now()>=S.cur.deadline){submit(true);return}runClock()}
  function stateGraded(){stopClock();gate.innerHTML="";rv.hidden=true;qsBox.hidden=false;bar.hidden=false;const last=S.hist[S.hist.length-1];
    show(last.ans,last.res,false);lock(true);setBar("graded");renderHist();
    gate.innerHTML=`<div class="gate sm"><b>Lần ${used()}/${MAXA}: ${last.score}/${last.total} câu đúng.</b> Câu sai được tô đỏ – em xem lại lý thuyết rồi bấm <b>Làm lại</b>. Còn ${MAXA-used()} lần.</div>`}
  function stateLocked(){stopClock();rv.hidden=true;qsBox.hidden=false;bar.hidden=false;const last=S.hist[S.hist.length-1];
    show(last.ans,last.res,true);lock(true);setBar("locked");renderHist();
    gate.innerHTML=`<div class="gate sm">${last.score===last.total?"🎉 Em làm đúng hết!":"Em đã dùng hết "+MAXA+" lần làm bài."} Bài đã khoá – dưới đây là bài làm lần cuối kèm đáp án và giải thích.</div>`}
  function current(){if(S.cur)return stateDoing();if(S.locked)return stateLocked();if(used())return stateGraded();stateIntro()}

  function submit(auto){if(!S.cur||el.dataset.busy)return;el.dataset.busy=1;stopClock();
    const a=read();S.cur.ans=a;save();lock(true);el.querySelector("#gr").disabled=true;
    gate.innerHTML=`<div class="gate sm">⏳ Đang chấm bài…</div>`;
    judge(a).then(res=>{const sc=score(res);
      S.hist.push({t:Date.now(),dur:Math.min(MIN*60,(Date.now()-S.cur.start)/1000),score:sc,total,ans:a,res,auto:!!auto});
      S.cur=null;if(S.hist.length>=MAXA||sc===total)S.locked=true;save();delete el.dataset.busy;
      if(window.IVY_TRACK){const sent=IVY_TRACK.send({type:"score",code:L.code,score:sc,total,detail:Object.assign(detail(res),{lan:S.hist.length})});
        const n=el.querySelector("#sentNote");if(n)n.textContent=sent?"✓ Đã gửi điểm cho giáo viên":"Đăng ký tên ở trang chủ để giáo viên nhận được điểm"}
      const best=store.get("best-"+L.code,0);if(sc>best)store.set("best-"+L.code,sc);
      current();el.scrollIntoView({behavior:"smooth"})})}

  el.addEventListener("click",e=>{
    const rb=e.target.closest("[data-rv]");if(rb){const i=+rb.dataset.rv,x=S.hist[i];stopClock();gate.innerHTML="";qsBox.hidden=false;bar.hidden=true;show(x.ans,x.res,S.locked);lock(true);
      rv.hidden=false;rv.innerHTML=`<span>👀 Đang xem lại <b>lần ${i+1}</b> · ${fmtD(x.t)} · ${x.score}/${x.total} câu đúng${S.locked?"":" (đáp án hiện sau lần "+MAXA+")"}</span><button class="btn sm" id="rvBack">Quay lại</button>`;
      rv.querySelector("#rvBack").addEventListener("click",()=>{current();el.scrollIntoView()});el.scrollIntoView({behavior:"smooth"});return}
    if(qsBox.classList.contains("locked")||!S.cur)return;
    const o=e.target.closest(".opt");if(o){o.parentNode.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));o.classList.add("sel");S.cur.ans=read();save();return}
    const b=e.target.closest(".letters button");if(b){b.parentNode.querySelectorAll("button").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");S.cur.ans=read();save()}
  });
  qsBox.addEventListener("input",()=>{if(S.cur){S.cur.ans=read();save()}});
  el.querySelector("#gr").addEventListener("click",()=>submit(false));
  el.querySelector("#rs").addEventListener("click",()=>{if(used()<MAXA&&!S.locked)stateIntro()});
  current();
}

/* ---------- WRITING / HOMEWORK ---------- */
function writing(L){
  const el=document.getElementById("p-w"),w=L.writing;
  let h=`<div class="ph"><div class="icon" style="background:linear-gradient(160deg,#c2417a,#ff7aa8)">📝</div><div><h2>${esc(w?w.title||"Luyện viết":"Bài về nhà")}</h2><p>${w&&w.lead?w.lead:"Bài viết được lưu tự động trên máy này."}</p></div></div>`;
  if(w){
    h+=`<div class="wbox"><h3>Đề bài</h3><div class="wprompt">${w.prompt}</div>
    ${w.tips?`<ul>${w.tips.map(t=>`<li>${t}</li>`).join("")}</ul>`:""}
    ${w.outline?`<details><summary>Gợi ý dàn ý</summary><div class="model">${w.outline}</div></details>`:""}
    <textarea class="inp" id="wt" placeholder="Viết bài của em ở đây…"></textarea>
    <div class="row" style="justify-content:space-between;margin-top:6px"><span class="wc" id="wc">0 từ</span><span class="note">Mục tiêu: ${w.words||"150–250"} từ</span></div>
    <div class="row" style="margin-top:10px"><button class="btn sm" id="wsend" type="button">📨 Nộp bài cho giáo viên</button><span class="note" id="wsent"></span></div>
    ${w.checklist?`<h3 style="margin-top:14px">Tự kiểm tra trước khi nộp</h3><ul class="checks">${w.checklist.map((c,i)=>`<li><label><input type="checkbox" data-c="${i}"> <span>${c}</span></label></li>`).join("")}</ul>`:""}
    ${w.model?`<details><summary>Xem bài mẫu (viết xong mới mở)</summary><div class="model">${w.model}</div></details>`:""}</div>`;
  }
  if(L.home)h+=`<div class="wbox"><h3>Bài về nhà</h3><ul class="checks">${L.home.map((t,i)=>`<li><label><input type="checkbox" data-h="${i}"> <span>${t}</span></label></li>`).join("")}</ul>
    <p class="note">Sổ lỗi: ghi câu sai theo mẫu <b>dạng bài · lý do sai · kiến thức · ngày làm lại (sau 7–14 ngày)</b>.</p></div>`;
  el.innerHTML=h;
  const k="w-"+L.code,t=el.querySelector("#wt");
  const ws=el.querySelector("#wsend");
  if(ws)ws.addEventListener("click",()=>{const txt=t.value.trim();const n=(txt.match(/\S+/g)||[]).length;const st=el.querySelector("#wsent");
    if(n<20){st.textContent="Bài viết quá ngắn, em viết thêm nhé.";return}
    if(!window.IVY_TRACK||!IVY_TRACK.me()){st.textContent="Em cần đăng ký tên ở trang chủ trước khi nộp.";return}
    IVY_TRACK.send({type:"essay",code:L.code,score:n,total:0,text:txt});st.textContent="✓ Đã nộp lúc "+new Date().toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"})+" ("+n+" từ)"});
  if(t){t.value=store.get(k,"");const cnt=()=>{const n=(t.value.trim().match(/\S+/g)||[]).length;el.querySelector("#wc").textContent=n+" từ"};cnt();t.addEventListener("input",()=>{store.set(k,t.value);cnt()})}
  const ck=store.get("c-"+L.code,{});
  el.querySelectorAll("input[type=checkbox]").forEach(c=>{const id=c.dataset.c!==undefined?"c"+c.dataset.c:"h"+c.dataset.h;c.checked=!!ck[id];c.addEventListener("change",()=>{ck[id]=c.checked;store.set("c-"+L.code,ck)})});
}
})();
</script>
</body>
